[package]
name = "constrs"
version = "0.1.0"
description = "A low-level collection of no alloc, `const`-time one-pass parsers, encoders and formatters"
edition = "2024"
rust-version = "1.85" # technically much lower, but aim is for 2024
authors = ["M. Yas. Davoodeh <MYDavoodeh@gmail.com>"]
repository = "https://github.com/Davoodeh/constrs"
license = "Apache-2.0 OR MIT"
keywords = ["const", "hex", "utf8", "encoder", "url"]
categories = ["no-std::no-alloc", "encoding", "embedded", "rust-patterns", "value-formatting"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]
